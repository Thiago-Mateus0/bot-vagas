# Fontes de vagas (Etapa 2). Lista pesquisada em 2026-11-11: cada token abaixo foi
# testado na API publica e devolveu um quadro de vagas existente (numero de vagas no dia).
# O filtro (filtros.yaml) descarta o que nao for remoto ou presencial/hibrido em Maceio,
# entao quadros com poucas vagas elegiveis custam so uma requisicao.
# Como descobrir um token novo:
#   - Greenhouse: URL da pagina de vagas  https://boards.greenhouse.io/<token>  ou  https://job-boards.greenhouse.io/<token>
#   - Lever: https://jobs.lever.co/<empresa>
# Nenhuma dessas APIs exige login ou chave.

greenhouse:
