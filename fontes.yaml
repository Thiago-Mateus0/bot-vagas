# Gupy: le a PAGINA PUBLICA de busca do portal (https://portal.gupy.io/job-search/term=<termo>),
# a mesma que um navegador carrega, sem login e sem rota interna. A API publica antiga foi
# desligada em 09/11/2026. RISCO: a estrutura da pagina (JSON em <script id="__NEXT_DATA__">)
# NAO e documentada e pode mudar sem aviso; quando isso acontecer o bot NAO tenta contornar:
# registra "Gupy: formato da pagina mudou ou acesso bloqueado" e `buscar` sai com codigo 1.
# HTTP 429/403 ou pagina de captcha param TODAS as requisicoes a Gupy naquela execucao.
# A busca e literal pelo termo no titulo da vaga (ex.: "estagio" ~100, "estagio ti" 18,
# "estagio backend" 0 em 2026-11-13), 12 vagas por pagina. A maioria das vagas de Maceio esta
# na Gupy (alem de BNE, Sine e CIEE, que o bot nao le).
gupy:
  max_paginas_por_termo: 5   # 12 vagas por pagina -> ate 60 por termo
  max_requisicoes: 40        # teto total de requisicoes a Gupy por execucao
  pausa_segundos: 2          # o codigo impoe minimo de 2 s
  termos:
    - estagio ti
    - estagio desenvolvedor
    - estagio desenvolvimento de software
    - estagio software
    - estagio programacao
    - estagio dados
    - estagio sistemas
    - estagio tecnologia
    - estagio backend
    - estagio python
    - estagio inteligencia artificial
    - trainee tecnologia
    - trainee ti
    - estagio remoto
    - estagio home office
    - estagio maceio
    - estagiario ti

# velrino/jobs (https://github.com/velrino/jobs): quadro de vagas de tecnologia em GitHub Issues, já classificado
# por etiquetas (level:intern, region:brazil, work:remote...). Lido pela API pública do GitHub, sem login.
# Vagas da Gupy daqui viram o mesmo endereço da busca da Gupy (não duplicam e entram no modo automático);
# as de outros sites (InHire, Sólides, Greenhouse...) ficam no painel para você se candidatar à mão.
# RISCO: repositório de um mantenedor só; se sumir ou mudar o formato, a fonte só deixa de trazer vagas.
velrino:
  ativo: true
  niveis: [intern]        # etiquetas level:<nivel>; ex.: [intern, entry-level]
  regioes: [brazil]       # etiquetas region:<regiao>; a vaga precisa ter as duas
  max_paginas: 3          # 100 vagas por página
