  - token: vtex              # 33
  - token: gympass           # 87 (Wellhub)
  - token: ebanx             # 36
  - token: stone             # 347
  - token: inter             # 118 (Banco Inter; varios estagios, em BH)
  - token: wildlifestudios   # 16 (varios estagios, em SP)
  - token: jusbrasil         # 20
  - token: rdstation         # 5
  - token: thoughtworks      # 46 (programa Graduate Developer)
  # --- Empresas remote-first / que aceitam contratado no exterior ---
