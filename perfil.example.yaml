experiencia:
  - id: lifetrailer
    empresa: LIFETRAILER STUDIO
    cargo:
      pt: Desenvolvedor In-House
      en: In-House Developer
    local:
      pt: Maceió, AL
      en: Maceió, Brazil
    periodo:
      pt: 07/2026 – atual
      en: 07/2026 – present
    bullets:
      - id: exp_sistema
        texto:
          pt: "Desenvolvo e mantenho, em produção, um sistema de gestão para quiosques em tablet com 8 módulos, em React, TypeScript, Node.js e PostgreSQL gerenciado na DigitalOcean. Versão de portfólio: github.com/Thiago-Mateus0/lifetrailer-studio."
          en: "I develop and maintain, in production, a tablet-kiosk management system with 8 modules, in React, TypeScript, Node.js and PostgreSQL managed on DigitalOcean. Portfolio version: github.com/Thiago-Mateus0/lifetrailer-studio."
      - id: exp_ia
        texto:
          pt: "Integrei IA ao sistema com a API da Anthropic: um assistente de ajuda (Merida) que responde dúvidas e prepara rascunhos para a pessoa confirmar, com teto de gasto por dia e sem permissão de gravar sozinho."
          en: "I integrated AI into the system with the Anthropic API: a help assistant (Merida) that answers questions and prepares drafts for the person to confirm, with a daily spending cap and no permission to write on its own."
      - id: exp_altegio
        texto:
          pt: "Implementei a integração com a plataforma Altegio por webhook: recepção autenticada, idempotência e registro bruto dos eventos."
          en: "I implemented the Altegio platform integration via webhook: authenticated reception, idempotency and raw event logging."
      - id: exp_plpgsql
        texto:
          pt: "Criei regras de negócio em PL/pgSQL, incluindo uma máquina de estados para as comandas, com testes automatizados no banco (pgTAP)."
          en: "I built business rules in PL/pgSQL, including a state machine for orders, with automated database tests (pgTAP)."
      - id: exp_auditoria
        texto:
          pt: "Garanti auditoria append-only no banco (triggers, RLS e revogação de permissões de exclusão), com hash encadeado e verificação de integridade."
          en: "I ensured append-only auditing in the database (triggers, RLS and revoked delete permissions), with a hash chain and integrity verification."
      - id: exp_ci
        texto:
          pt: "Configurei CI no GitHub Actions que recria o banco do zero e roda toda a suíte de testes a cada pull request."
          en: "I set up CI on GitHub Actions that rebuilds the database from scratch and runs the full test suite on every pull request."
      - id: exp_adrs
        texto:
          pt: "Documento decisões de arquitetura (ADRs) e conduzo revisões e análise de riscos antes da implementação."
          en: "I document architecture decisions (ADRs) and run reviews and risk analysis before implementation."

