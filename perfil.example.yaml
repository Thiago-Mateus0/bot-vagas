resumo:
  pt: >-
    Desenvolvedor júnior e estudante de Ciência da Computação que une comunicação clara,
    liderança técnica e aprendizado rápido a experiência real em produção: construo um sistema
    de gestão completo, de integrações por webhook a regras de negócio em PostgreSQL. Trabalho
    com TypeScript, Python e SQL, escrevo testes e documentação, uso agentes de código
    (Claude Code e Codex) no dia a dia e quero me aprofundar em inteligência artificial.
    Busco estágio ou a primeira vaga como desenvolvedor júnior.
  en: >-
    Junior developer and Computer Science student who combines clear communication, technical
    leadership and fast learning with real production experience: I build a complete management
    system, from webhook integrations to business rules in PostgreSQL. I work with TypeScript,
    Python and SQL, write tests and documentation, use coding agents (Claude Code and Codex)
    daily and want to go deeper into artificial intelligence. Looking for an internship or my
    first junior developer role.

