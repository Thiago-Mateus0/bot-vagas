name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      # Sem perfil.yaml: os testes usam perfil.example.yaml. Sem rede externa, sem API paga.
      - name: Rodar testes
        run: pytest -q
