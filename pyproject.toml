[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-vagas"
version = "0.1.0"
description = "Bot de candidaturas a vagas - Etapa 1: perfil, gerador de curriculo e verificador de fatos"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "pypdf>=4",
    "playwright>=1.40",
    "anthropic>=0.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "keyring>=25",  # senha da Gupy no chaveiro do sistema (decisão de 17/11), nunca em arquivo
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
bot-vagas = "bot_vagas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bot_vagas = ["templates/*", "templates/painel/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
